plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'com.x2x.desktop.MainApp'
    applicationName = '2x2-Wallet'
}

javafx {
    version = '17.0.14'
    modules = ['javafx.controls', 'javafx.graphics']
}

dependencies {
    implementation project(':x2x-core')
    implementation 'com.google.zxing:core:3.5.3'
}

// Fat JAR of project classes + non-JavaFX deps (JavaFX is supplied per-platform at runtime).
// Strip dependency JAR signatures — keeping META-INF/*.SF/*.DSA/*.RSA from BouncyCastle
// causes: SecurityException: Invalid signature file digest for Manifest main attributes
// (Windows shows this as the generic "A JNI error has occurred" dialog).
tasks.register('desktopJar', Jar) {
    group = 'build'
    archiveBaseName = '2x2-wallet-desktop'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': 'com.x2x.desktop.MainApp',
                'Implementation-Title': '2X2 Wallet Desktop',
                'Implementation-Version': '1.3.2'
        )
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath
                .findAll { it.name.endsWith('.jar') }
                .findAll { !it.name.toLowerCase().contains('javafx') }
                .collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.EC'
    exclude 'META-INF/SIG-*'
}

tasks.named('build') { dependsOn desktopJar }

tasks.register('printDesktopJar') {
    dependsOn desktopJar
    doLast {
        println desktopJar.archiveFile.get().asFile.absolutePath
    }
}
